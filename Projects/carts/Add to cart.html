<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: auto;
      }

      .rating {
        padding-left: 20px;
        margin: 0px;
      }
      .discription {
        font-size: small;
        color: rgb(66, 56, 56);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
        font-weight: 400;
        text-align: justify;
        padding-left: 20px;
        padding-right: 20px;
      }
      .header {
        font-family: "Times New Roman", Times, serif;
        font-weight: 400;
        text-indent: 20px;
      }
      .cart {
        width: 300px;
        height: 600px;
        border: 2px white solid;
        border-radius: 10px;
        margin: 50px;
        background-color: white;
      }
      .outerbox {
        width: 400px;
        height: 700px;
        border: 2px white solid;
        border-radius: 20px;
        background-color: black;
      }
      .rate {
        padding-left: 110px;
        font-size: xx-large;
        margin: 3px;
      }
    </style>
  </head>
  <body>
    <div class="outerbox">
      <div class="cart">
        <img
          src="https://cdn-icons-png.flaticon.com/512/25/25619.png"
          alt=""
          width="30px"
          style="float: right; padding: 30px"
        />
        <img
          src="https://e7.pngegg.com/pngimages/816/974/png-clipart-puma-logo-puma-logo-sneakers-clothing-brand-adidas-cat-like-mammal-carnivoran.png"
          alt=""
          width="70px"
          style="padding: 20px"
        />
        <img
          src="https://static.nike.com/a/images/c_limit,w_592,f_auto/t_product_v1/u_126ab356-44d8-4a06-89b4-fcdcc8df0245,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/a92219ed-b339-46d0-958c-531b76fced10/WMNS+AIR+JORDAN+1+RETRO+HI+OG.png"
          alt=""
          width="200"
          style="padding-left: 40px"
        />
        <br />
        <h2 class="header">Air jordan 1 high OG</h2>
        <h3 class="discription">
          The smoothness is unmatched. The summer after his rookie year, MJ went
          full MJ at an exhibition game in Italy when he threw down a dunk so
          powerful the backboard shattered.
        </h3>

        <h2 class="rating">&#9733;&#9733;&#9733;&#9733;&#9733;</h2>
        <h2 class="rate"><sup style="color: red">$</sup>5.00/-</h2>
        <div>
          <form action="">
            <input
              type="button"
              name=""
              id=""
              value="Add to Cart"
              style="
                width: 250px;
                height: 40px;
                margin-left: 25px;
                margin-top: 20px;
                color: white;
                background-color: black;
                border: 2px black solid;
                border-radius: 10px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont,
                  'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
                  'Helvetica Neue', sans-serif;
                font-size: larger;
              "
            />
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
